name: Build MagicBox Riva

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Siapkan Lingkungan
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget

      - name: Update Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Konfigurasi Target Riva (Snapdragon 425)
        run: |
          echo "CONFIG_TARGET_armsr=y" > .config
          echo "CONFIG_TARGET_armsr_armv8=y" >> .config
          echo "CONFIG_TARGET_armsr_armv8_DEVICE_generic=y" >> .config
          # Driver Layar & SoC Snapdragon
          echo "CONFIG_PACKAGE_kmod-drm-msm=y" >> .config
          echo "CONFIG_PACKAGE_kmod-fb=y" >> .config
          echo "CONFIG_PACKAGE_kmod-simplefb=y" >> .config
          echo "CONFIG_PACKAGE_kmod-qcom-spmi=y" >> .config
          make defconfig

      - name: Download Package
        run: make download -j$(nproc)

      - name: Memasak Firmware
        run: make -j$(nproc) || make -j1 V=s

      - name: Upload Hasil Jadi
        uses: actions/upload-artifact@v4
        with:
          name: MagicBox-Riva-Firmware
          path: bin/targets/armsr/armv8/
