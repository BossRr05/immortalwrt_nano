name: Build MagicBox Riva - Screen Terminal

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Siapkan Lingkungan
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget

      - name: Update Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Paksa Aktifkan Tampilan Layar LCD (VT & FB Console)
        run: |
          echo "CONFIG_TARGET_armsr=y" > .config
          echo "CONFIG_TARGET_armsr_armv8=y" >> .config
          echo "CONFIG_TARGET_armsr_armv8_DEVICE_generic=y" >> .config
          
          # SKLARKAR UTAMA TAMPILAN TEKS DI LAYAR LCD HP
          echo "CONFIG_KERNEL_VT=y" >> .config
          echo "CONFIG_KERNEL_VT_CONSOLE=y" >> .config
          echo "CONFIG_KERNEL_FRAMEBUFFER_CONSOLE=y" >> .config
          echo "CONFIG_PACKAGE_kmod-fb=y" >> .config
          echo "CONFIG_PACKAGE_kmod-simplefb=y" >> .config
          echo "CONFIG_PACKAGE_kmod-drm-msm=y" >> .config
          
          make defconfig

      - name: Download & Memasak Kernel Layar
        run: |
          make download -j$(nproc)
          make -j$(nproc) || make -j1 V=s

      - name: Upload Hasil
        uses: actions/upload-artifact@v4
        with:
          name: MagicBox-Riva-TerminalScreen
          path: bin/targets/armsr/armv8/
